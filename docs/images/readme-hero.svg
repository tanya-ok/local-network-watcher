<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Where things go — Local Watch</title>
  <desc id="desc">Illustrative local network map. Sample processes on one Mac connect along moving routes to remote services. A mini airplane marks the direction of travel. Real addresses and traffic are not shown.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5ec"/><stop offset="1" stop-color="#ecefe7"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#f4f2e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26362e" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#63836d"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .ink{fill:#29372f}.muted{fill:#738076}.moss{fill:#557b61}.rust{fill:#b65c43}.thin{stroke:#d7d9cf;stroke-width:1.3}.route{fill:none;stroke:#789780;stroke-width:2.3;stroke-dasharray:7 10;stroke-linecap:round;marker-end:url(#arrow)}
      .plane{fill:#b65c43;filter:drop-shadow(0 2px 2px #26362e30)}
    </style>
  </defs>
  <rect width="1440" height="760" rx="30" fill="url(#paper)"/>
  <path d="M0 548C300 490 445 623 760 564s440-105 680-43v239H0Z" fill="#e5ebe2" opacity=".5"/>
  <g class="sans">
    <g transform="translate(78 72)"><circle r="24" fill="none" stroke="#557b61" stroke-width="1.6"/><path d="M-8 8 8-8M1-8h7v7" fill="none" stroke="#557b61" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="116" y="80" class="serif ink" font-size="22" font-weight="600">Local Watch</text>
    <text x="1360" y="78" text-anchor="end" class="sans moss" font-size="12" letter-spacing="2.1">LOCAL NETWORK MONITOR</text>
    <text x="78" y="170" class="serif ink" font-size="66" letter-spacing="-2.3">Where things go</text>
    <text x="80" y="211" class="serif muted" font-size="21" font-style="italic">A live view of connections open on this Mac.</text>
    <g transform="translate(80 256)"><rect width="244" height="32" rx="16" fill="#e5ede2"/><circle cx="16" cy="16" r="4" fill="#63836d"/><text x="30" y="20" class="sans moss" font-size="11" letter-spacing="1.2">ILLUSTRATIVE ROUTE · NO REAL DATA</text></g>
  </g>

  <g filter="url(#shadow)"><rect x="76" y="326" width="1288" height="355" rx="20" fill="url(#panel)" stroke="#deddd2"/></g>
  <g class="sans">
    <text x="112" y="370" class="ink" font-size="13" font-weight="650">CONNECTION MAP</text>
    <text x="1328" y="370" text-anchor="end" class="muted" font-size="12">Example only · routes simplify real network paths</text>
    <path d="M110 392H1330" class="thin"/>
    <text x="122" y="428" class="muted" font-size="10" letter-spacing="1.4">ON THIS MAC</text>
    <text x="1308" y="428" text-anchor="end" class="muted" font-size="10" letter-spacing="1.4">REMOTE SERVICES</text>
  </g>

  <!-- Example route paths run left to right; the plane nose points right. -->
  <path d="M370 478C560 478 610 447 824 451S1038 462 1113 462" class="route" opacity=".9"/>
  <path d="M370 545C556 545 626 594 824 584S1026 526 1113 526" class="route" opacity=".5"/>
  <path d="M370 613C582 613 650 525 824 522S1024 611 1113 612" fill="none" stroke="#b65c43" stroke-width="2" stroke-dasharray="5 10" stroke-linecap="round" opacity=".8"/>
  <g transform="translate(709 447) scale(.9)"><path class="plane" d="M-20 0 3-3 12-13 16-13 13-3 30 0 13 3 16 13 12 13 3 3-20 0Z"/></g>

  <g class="sans">
    <g transform="translate(126 450)"><rect width="244" height="56" rx="11" fill="#f7f8f2" stroke="#dfe2d8"/><circle cx="26" cy="28" r="14" fill="#e4ebe1"/><rect x="21" y="20" width="10" height="16" rx="2" fill="none" stroke="#557b61" stroke-width="1.5"/><text x="52" y="25" class="ink" font-size="13" font-weight="600">Browser</text><text x="52" y="42" class="muted" font-size="10">TCP · local socket</text><text x="222" y="34" text-anchor="end" class="mono muted" font-size="9">EXAMPLE</text></g>
    <g transform="translate(126 517)"><rect width="244" height="56" rx="11" fill="#f7f8f2" stroke="#dfe2d8"/><circle cx="26" cy="28" r="14" fill="#e5edf3"/><path d="M20 29h12M22 24h8M22 34h8" stroke="#52778a" stroke-width="1.5" stroke-linecap="round"/><text x="52" y="25" class="ink" font-size="13" font-weight="600">Notes</text><text x="52" y="42" class="muted" font-size="10">UDP · local socket</text><text x="222" y="34" text-anchor="end" class="mono muted" font-size="9">EXAMPLE</text></g>
    <g transform="translate(126 584)"><rect width="244" height="56" rx="11" fill="#f7f8f2" stroke="#dfe2d8"/><circle cx="26" cy="28" r="14" fill="#f5e9e1"/><path d="M20 31c3-7 9-7 12 0m-10-6 8 8" fill="none" stroke="#b65c43" stroke-width="1.4" stroke-linecap="round"/><text x="52" y="25" class="ink" font-size="13" font-weight="600">Sample app</text><text x="52" y="42" class="muted" font-size="10">new route · inspect context</text><text x="222" y="34" text-anchor="end" class="mono rust" font-size="9">LOOK CLOSER</text></g>
  </g>

  <g class="sans">
    <g transform="translate(1113 438)"><circle cx="31" cy="24" r="23" fill="#e8eee6"/><path d="M19 24h24m-7-7 7 7-7 7" fill="none" stroke="#557b61" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="22" class="ink" font-size="12" font-weight="600">service.example</text><text x="68" y="40" class="muted" font-size="10">HTTPS · port 443</text></g>
    <g transform="translate(1113 502)"><circle cx="31" cy="24" r="23" fill="#e8eee6"/><path d="M20 18h22v13H20zM25 14h12v4" fill="none" stroke="#557b61" stroke-width="1.7" stroke-linejoin="round"/><text x="68" y="22" class="ink" font-size="12" font-weight="600">Local network</text><text x="68" y="40" class="muted" font-size="10">destination · example</text></g>
    <g transform="translate(1113 588)"><circle cx="31" cy="24" r="23" fill="#f5e9e1"/><path d="M31 11v15m0 7v1" stroke="#b65c43" stroke-width="2.2" stroke-linecap="round"/><text x="68" y="22" class="ink" font-size="12" font-weight="600">Unfamiliar endpoint</text><text x="68" y="40" class="muted" font-size="10">a clue to investigate, not a verdict</text></g>
  </g>
  <g class="serif" fill="#738076" font-size="11" font-style="italic"><text x="720" y="662" text-anchor="middle">The plane shows direction in this illustration. Real traffic travels as packets and frames.</text></g>
</svg>
